<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">AI・人間・共通WBS・ガントチャート・GitHub Issues・PMの関係図</title>
  <desc id="svg-desc">共通のWBS・ガントチャートを中心に、上部にPM、左にAI、右に人間、下部にGitHub Issuesを配置し、データ更新系（実線）とデータ取得系（破線）の矢印で連携サイクルを示す構成図</desc>

  <defs>
    <style>
      .font-base { font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', sans-serif; }
      .card-title { font-size: 15px; font-weight: 700; }
      .pill-text { font-size: 12px; font-weight: 700; }
      .item-text { font-size: 13px; font-weight: 500; fill: #334155; }
      .arrow-label { font-size: 12px; font-weight: 700; }
      .legend-text { font-size: 11px; font-weight: 600; fill: #475569; }
    </style>

    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c2410c"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e3a5f"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="900" height="500" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ================= LEGEND (TOP RIGHT) ================= -->
  <g>
    <rect x="748" y="20" width="132" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="760" y1="38" x2="788" y2="38" stroke="#475569" stroke-width="2" marker-end="url(#arrow-muted)"/>
    <text x="796" y="42" class="font-base legend-text">データ更新系</text>
    <line x1="760" y1="58" x2="788" y2="58" stroke="#475569" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-muted)"/>
    <text x="796" y="62" class="font-base legend-text">データ取得系</text>
  </g>

  <!-- ================= TOP: PM VIEWPOINT ================= -->
  <g filter="url(#card-shadow)">
    <rect x="170" y="20" width="560" height="86" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <rect x="170" y="20" width="560" height="32" rx="10" fill="#0f766e"/>
    <rect x="170" y="42" width="560" height="10" fill="#0f766e"/>
    <text x="450" y="41" text-anchor="middle" class="font-base card-title" fill="#ffffff">PM（管理者）：全体像の把握</text>

    <rect x="192" y="64" width="156" height="30" rx="15" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
    <text x="270" y="84" text-anchor="middle" class="font-base pill-text" fill="#0f766e">現在地</text>

    <rect x="372" y="64" width="156" height="30" rx="15" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
    <text x="450" y="84" text-anchor="middle" class="font-base pill-text" fill="#0f766e">ボトルネック</text>

    <rect x="552" y="64" width="156" height="30" rx="15" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
    <text x="630" y="84" text-anchor="middle" class="font-base pill-text" fill="#0f766e">完了見通し</text>
  </g>

  <!-- Vertical Arrows: PM <-> WBS (取得系=破線, 更新系=実線) -->
  <line x1="408" y1="162" x2="408" y2="114" stroke="#1e3a5f" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-navy)"/>
  <text x="396" y="142" text-anchor="end" class="font-base arrow-label" fill="#1e3a5f">全体状況を俯瞰</text>

  <line x1="492" y1="106" x2="492" y2="154" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="504" y="142" text-anchor="start" class="font-base arrow-label" fill="#0f766e">タスク登録・方針調整</text>

  <!-- ================= MIDDLE LEFT: AI ================= -->
  <g filter="url(#card-shadow)">
    <rect x="20" y="164" width="196" height="186" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="20" y="164" width="196" height="36" rx="10" fill="#2563eb"/>
    <rect x="20" y="190" width="196" height="10" fill="#2563eb"/>
    <text x="118" y="187" text-anchor="middle" class="font-base card-title" fill="#ffffff">AI</text>

    <rect x="34" y="214" width="168" height="24" rx="12" fill="#dbeafe"/>
    <text x="118" y="230" text-anchor="middle" class="font-base pill-text" fill="#1d4ed8">並列稼働・平準化不要</text>

    <text x="118" y="268" text-anchor="middle" class="font-base item-text">検知・WBS登録</text>
    <text x="118" y="298" text-anchor="middle" class="font-base item-text">設計案・実装・テスト</text>
    <text x="118" y="328" text-anchor="middle" class="font-base item-text">デプロイ・クローズ</text>
  </g>

  <!-- ================= MIDDLE CENTER: WBS / GANTT CHART ================= -->
  <g filter="url(#card-shadow)">
    <rect x="340" y="164" width="220" height="186" rx="10" fill="#ffffff" stroke="#1e3a5f" stroke-width="2.5"/>
    <rect x="340" y="164" width="220" height="36" rx="10" fill="#1e3a5f"/>
    <rect x="340" y="190" width="220" height="10" fill="#1e3a5f"/>
    <text x="450" y="187" text-anchor="middle" class="font-base card-title" fill="#ffffff">共通のWBS・ガントチャート</text>

    <rect x="354" y="216" width="192" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="450" y="238" text-anchor="middle" class="font-base pill-text" fill="#1e3a5f">作業構造・論理的依存関係</text>

    <rect x="354" y="260" width="192" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="450" y="282" text-anchor="middle" class="font-base pill-text" fill="#1e3a5f">優先度・平準化計算</text>

    <rect x="354" y="304" width="192" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="450" y="326" text-anchor="middle" class="font-base pill-text" fill="#1e3a5f">Issue完了マイルストーン</text>
  </g>

  <!-- ================= MIDDLE RIGHT: HUMAN ================= -->
  <g filter="url(#card-shadow)">
    <rect x="684" y="164" width="196" height="186" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <rect x="684" y="164" width="196" height="36" rx="10" fill="#c2410c"/>
    <rect x="684" y="190" width="196" height="10" fill="#c2410c"/>
    <text x="782" y="187" text-anchor="middle" class="font-base card-title" fill="#ffffff">人間（担当者）</text>

    <rect x="698" y="214" width="168" height="24" rx="12" fill="#ffedd5"/>
    <text x="782" y="230" text-anchor="middle" class="font-base pill-text" fill="#9a3412">直列処理・平準化対象</text>

    <text x="782" y="280" text-anchor="middle" class="font-base item-text">各種レビュー・承認</text>
    <text x="782" y="316" text-anchor="middle" class="font-base item-text">リリース最終判断</text>
  </g>

  <!-- ================= ARROWS: AI <-> WBS ================= -->
  <!-- 更新系（実線） -->
  <line x1="216" y1="232" x2="332" y2="232" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="278" y="222" text-anchor="middle" class="font-base arrow-label" fill="#1d4ed8">登録・実績更新</text>

  <!-- 取得系（破線） -->
  <line x1="340" y1="298" x2="224" y2="298" stroke="#1e3a5f" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-navy)"/>
  <text x="278" y="288" text-anchor="middle" class="font-base arrow-label" fill="#1e3a5f">監視・自動着手</text>

  <!-- ================= ARROWS: WBS <-> HUMAN ================= -->
  <!-- 取得系（破線） -->
  <line x1="560" y1="232" x2="676" y2="232" stroke="#1e3a5f" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-navy)"/>
  <text x="622" y="222" text-anchor="middle" class="font-base arrow-label" fill="#1e3a5f">優先度順に提示</text>

  <!-- 更新系（実線） -->
  <line x1="684" y1="298" x2="568" y2="298" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="622" y="288" text-anchor="middle" class="font-base arrow-label" fill="#c2410c">登録・承認・完了</text>

  <!-- ================= BOTTOM CENTER: GITHUB ISSUES ================= -->
  <g filter="url(#card-shadow)">
    <rect x="270" y="396" width="360" height="84" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <rect x="270" y="396" width="360" height="32" rx="10" fill="#24292f"/>
    <rect x="270" y="418" width="360" height="10" fill="#24292f"/>
    <text x="450" y="417" text-anchor="middle" class="font-base card-title" fill="#ffffff">GitHub Issues</text>

    <rect x="292" y="440" width="148" height="28" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="366" y="459" text-anchor="middle" class="font-base pill-text" fill="#334155">作業詳細・ログ</text>

    <rect x="460" y="440" width="148" height="28" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="534" y="459" text-anchor="middle" class="font-base pill-text" fill="#334155">PR・レビュー履歴</text>
  </g>

  <!-- ================= ARROWS: AI -> GITHUB ISSUES (更新系・実線) ================= -->
  <path d="M 118 350 L 118 438 L 262 438" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="192" y="428" text-anchor="middle" class="font-base arrow-label" fill="#1d4ed8">未起票なら登録</text>
  <text x="192" y="456" text-anchor="middle" class="font-base arrow-label" fill="#1d4ed8">詳細記録・クローズ</text>

  <!-- ================= ARROWS: HUMAN <-> GITHUB ISSUES (取得系・破線 / 更新系・実線) ================= -->
  <!-- 取得系（破線）: GitHub Issues -> 人間 -->
  <path d="M 630 420 L 756 420 L 756 358" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-dark)"/>
  <text x="694" y="410" text-anchor="middle" class="font-base arrow-label" fill="#334155">詳細・PR確認</text>

  <!-- 更新系（実線）: 人間 -> GitHub Issues -->
  <path d="M 806 350 L 806 458 L 638 458" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="722" y="476" text-anchor="middle" class="font-base arrow-label" fill="#c2410c">レビュー・コメント</text>
</svg>
